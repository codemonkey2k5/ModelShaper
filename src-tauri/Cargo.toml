[package]
name = "modelshaper"
version = "0.2.11"
description = "ModelShaper - adapt local LLMs on your PC"
authors = ["ModelShaper"]
edition = "2021"

[lib]
name = "modelshaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = "0.33"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
